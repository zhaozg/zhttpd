# zhttpd Configuration File
# This is the main configuration file for zhttpd web server
# All settings can be customized to fit your deployment needs

# Server Binding Configuration
# -----------------------------
# host: The IP address to bind the server to
#   - "0.0.0.0" binds to all available interfaces (default)
#   - "127.0.0.1" binds only to localhost
#   - Specific IP address for single interface binding
host: "0.0.0.0"

# port: The TCP port number to listen on
#   - Common choices: 80 (HTTP), 8080 (HTTP alternate), 443 (HTTPS)
#   - Range: 1-65535 (ports < 1024 require root/admin privileges)
port: 8080

# Static File Serving Configuration
# ----------------------------------
# static_dir: Directory path for serving static files
#   - Relative paths are resolved from the server's working directory
#   - Absolute paths can also be used
#   - Example files: HTML, CSS, JavaScript, images, fonts
static_dir: "./examples/static"

# Lua Scripting Configuration
# ----------------------------
# lua_scripts_dir: Directory containing Lua scripts for dynamic content
#   - Scripts are accessed via /api/{script_name} endpoints
#   - Example: /api/test loads and executes lua_scripts_dir/test.lua
lua_scripts_dir: "./examples/lua"

# enable_lua: Enable or disable Lua script execution
#   - true: Lua API endpoints are active
#   - false: Lua functionality is disabled, /api/* returns 404
enable_lua: true

# reload: Script file caching and reload strategy
#   - "never": Cache scripts in memory permanently after first load (best performance)
#   - "auto": Detect file modifications and reload automatically (recommended for development)
#   - "force": Always reload scripts from disk on each request (useful for debugging)
#   Default: "auto"
reload: "auto"

# max_cache_file_size: Maximum file size to cache in bytes
#   - Files larger than this size will not be cached
#   - Default: 1048576 (1MB)
#   - Set to 0 to disable caching for all files
max_cache_file_size: 1048576

# enable_etag: Enable ETag support for static files
#   - true: Generates weak ETags based on file size and modification time
#   - ETags enable efficient HTTP caching with 304 Not Modified responses
#   - Reduces bandwidth usage for unchanged files
#   - Recommended for production deployments
enable_etag: true

# GraphQL Configuration
# ---------------------
# enable_graphql: Enable or disable GraphQL endpoint
#   - true: GraphQL queries and mutations are processed
#   - false: GraphQL endpoint returns 404
enable_graphql: true

# graphql_endpoint: URL path for the GraphQL endpoint
#   - Typically "/graphql" (industry standard)
#   - POST requests to this path execute GraphQL queries
graphql_endpoint: "/graphql"

# Security Configuration
# ----------------------
# security_headers: Enable HTTP security headers
#   - true: Adds CSP, X-Frame-Options, HSTS, etc. (recommended for production)
#   - false: No additional security headers (useful for development/testing)
#   Security headers included when enabled:
#     - Content-Security-Policy
#     - X-Frame-Options
#     - X-Content-Type-Options
#     - X-XSS-Protection
#     - Strict-Transport-Security (HSTS)
#     - Referrer-Policy
#     - Permissions-Policy
security_headers: true

# Performance and Resource Limits
# --------------------------------
# max_body_size: Maximum size of HTTP request body in bytes
#   - Prevents memory exhaustion from large uploads
#   - 10485760 bytes = 10 MB (default)
#   - Adjust based on your application needs (file uploads, API payloads)
max_body_size: 10485760

# timeout_seconds: Request timeout in seconds
#   - Maximum time to wait for a complete request
#   - 30 seconds is a reasonable default for most applications
#   - Increase for long-running operations or slow clients
timeout_seconds: 30

# thread_pool_size: Number of worker threads for handling requests
#   - Recommended: Number of CPU cores or slightly higher
#   - Too low: Reduced concurrency and throughput
#   - Too high: Increased context switching overhead
#   - 4 is a good starting point for most servers
thread_pool_size: 4

# max_connections: Maximum number of concurrent connections
#   - Controls how many simultaneous client connections the server accepts
#   - Higher values support more concurrent users but use more memory
#   - 512 is a balanced default for most deployments
#   - Increase for high-traffic sites (1024, 2048, etc.)
#   - Decrease for resource-constrained environments (256, 128)
max_connections: 512

# request_buffer_size: Buffer size for request/response processing in bytes
#   - Memory allocated per request for buffering data
#   - 65536 bytes = 64KB (default, good for most use cases)
#   - Larger buffers (128KB, 256KB) improve performance for large requests
#   - Smaller buffers (32KB, 16KB) reduce memory usage
#   - Trade-off between performance and memory consumption
request_buffer_size: 65536

# Logging Configuration
# ---------------------
# log_level: Verbosity of log output
#   - "debug": Detailed debugging information (verbose)
#   - "info": General informational messages (recommended for production)
#   - "warn": Warning messages only
#   - "error": Error messages only (minimal logging)
log_level: "info"

# log_file: Path to application log file (optional)
#   - If specified, application logs are written to this file
#   - If not specified or empty, logs go to stdout only
#   - Logs include timestamps with microsecond precision
#   - Automatic rotation when file reaches 10MB (keeps 5 backups)
#   - Example: "zhttpd.log" or "/var/log/zhttpd.log"
# log_file: "zhttpd.log"

# access_log_file: Path to HTTP access log file (optional)
#   - If specified, all HTTP requests are logged in Common Log Format
#   - Includes: IP, timestamp, method, path, status, bytes, user-agent, duration
#   - Timestamps include microsecond precision for performance analysis
#   - Automatic rotation when file reaches 10MB (keeps 5 backups)
#   - Example: "access.log" or "/var/log/zhttpd/access.log"
# access_log_file: "access.log"

# Advanced Features (Phase 3)
# ============================

# WebSocket Support
# -----------------
# enable_websocket: Enable WebSocket protocol support
#   - true: WebSocket connections are accepted at /ws endpoint
#   - GraphQL subscriptions available at /graphql/ws when both WebSocket and GraphQL are enabled
#   - Messages are handled by websocket.lua script in lua_scripts_dir
#   - false: WebSocket support disabled (default)
enable_websocket: true

# Server-Sent Events (SSE)
# -------------------------
# enable_sse: Enable Server-Sent Events endpoint
#   - true: SSE endpoint available at /events
#   - false: SSE disabled (default)
# enable_sse: false

# Rate Limiting
# -------------
# enable_rate_limit: Enable request rate limiting
#   - Protects against abuse and DoS attacks
#   - Uses token bucket algorithm with per-IP tracking
# enable_rate_limit: false
# rate_limit_requests: 100  # Maximum requests per window
# rate_limit_window: 60     # Window size in seconds

# CORS (Cross-Origin Resource Sharing)
# -------------------------------------
# enable_cors: Enable CORS headers for cross-origin requests
#   - Allows web applications from different origins to access the API
# enable_cors: false
# cors_origins: "*"  # Allowed origins (* for any, or comma-separated list)
# cors_methods: "GET, POST, PUT, DELETE, OPTIONS"
# cors_headers: "Content-Type, Authorization"

# Authentication Middleware
# --------------------------
# enable_auth: Enable authentication middleware
#   - Token validation is delegated to a Lua script for flexibility
#   - Supports JWT and OAuth token formats
#   - The Lua script receives token, method, path, and type
# enable_auth: false
# auth_script: "auth"  # Lua script name (without .lua extension)
# auth_protected_paths: "/api/*"  # Paths requiring authentication
# auth_public_paths: "/api/login, /api/register"  # Always public paths

# Lua Sandbox Configuration
# --------------------------
# lua_sandbox_enabled: Enable Lua sandboxing
#   - true: Dangerous functions (io, debug, os.execute, etc.) are disabled
#   - false: Full Lua library access (use only for trusted scripts)
#   - Default: true (safe default)
lua_sandbox_enabled: true

# lua_max_instructions: Maximum Lua instructions per script execution
#   - Prevents infinite loops and runaway scripts
#   - 0 = unlimited (not recommended for production)
#   - 100000 = default, suitable for most scripts
#   - Increase for complex scripts, decrease for stricter resource control
lua_max_instructions: 100000

# Configuration Tips
# ------------------
# 1. For development: Set security_headers to false, log_level to "debug"
# 2. For production: Enable security_headers, set log_level to "info" or "warn"
# 3. Monitor performance and adjust thread_pool_size based on CPU usage
# 4. Set appropriate max_body_size based on expected upload sizes
# 5. Use log_file for production to maintain persistent logs
# 6. Keep timeout_seconds reasonable to prevent resource exhaustion
# 7. Enable rate_limit in production to prevent abuse
# 8. Configure CORS if serving a web API consumed by browser clients

# Observability (Phase 5)
# ------------------------
# enable_metrics: Enable Prometheus metrics endpoint at /metrics
#   - Exposes request counts, latency histograms, error rates, etc.
#   - Default: true
enable_metrics: true

# enable_health_check: Enable health check endpoint at /health
#   - Returns JSON with component status and uptime
#   - Useful for load balancers and Kubernetes probes
#   - Default: true
enable_health_check: true

# enable_request_id: Enable X-Request-ID header propagation
#   - Generates unique ID for each request if not provided by client
#   - Useful for distributed tracing and debugging
#   - Default: true
enable_request_id: true

# log_format: Log output format
#   - "text": Human-readable format (default)
#   - "json": Structured JSON format for log aggregation
log_format: "text"

# Example Production Configuration:
# ----------------------------------
# host: "0.0.0.0"
# port: 80
# static_dir: "/var/www/html"
# lua_scripts_dir: "/var/www/scripts"
# security_headers: true
# max_body_size: 52428800  # 50MB for larger uploads
# timeout_seconds: 60
# thread_pool_size: 8  # For 4-core CPU with hyperthreading
# enable_lua: true
# enable_graphql: true
# graphql_endpoint: "/graphql"
# log_level: "info"
# log_file: "/var/log/zhttpd/access.log"
# enable_rate_limit: true
# rate_limit_requests: 1000
# enable_cors: true
# cors_origins: "https://example.com, https://app.example.com"

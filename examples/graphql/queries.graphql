# Example GraphQL Queries

## Get all users
query {
  users {
    id
    name
    email
    createdAt
  }
}

## Get specific user with posts
query {
  user(id: "1") {
    id
    name
    email
    posts {
      id
      title
      createdAt
    }
  }
}

## Create new user
mutation {
  createUser(input: {
    name: "张三"
    email: "zhangsan@example.com"
  }) {
    id
    name
    email
    createdAt
  }
}

## Create new post
mutation {
  createPost(input: {
    title: "我的第一篇文章"
    content: "这是使用 zhttpd GraphQL API 创建的文章。"
    authorId: "1"
  }) {
    id
    title
    author {
      name
    }
    createdAt
  }
}

## Update user
mutation {
  updateUser(id: "1", input: {
    name: "张三（已更新）"
  }) {
    id
    name
    email
  }
}

host: "0.0.0.0"
port: 8080
static_dir: "./examples/static"
lua_scripts_dir: "./examples/lua"
security_headers: true
max_body_size: 10485760  # 10MB
timeout_seconds: 30
thread_pool_size: 4
max_connections: 512  # Maximum concurrent connections
request_buffer_size: 65536  # Request/response buffer size (64KB)
enable_lua: true
enable_graphql: true
graphql_endpoint: "/graphql"
log_level: "info"
log_file: "zhttpd.log"
access_log_file: "access.log"
reload: "auto"  # Script reload mode: never, auto, or force
max_cache_file_size: 1048576  # Maximum file size to cache (1MB)
enable_etag: true  # Enable ETag caching for static files

# Phase 3: Advanced httpz Features
# ---------------------------------

# WebSocket Support
enable_websocket: false  # Enable WebSocket support

# Server-Sent Events (SSE)
enable_sse: false  # Enable SSE endpoint at /events

# Rate Limiting
enable_rate_limit: false  # Enable rate limiting middleware
rate_limit_requests: 100  # Maximum requests per window
rate_limit_window: 60  # Window size in seconds

# CORS (Cross-Origin Resource Sharing)
enable_cors: false  # Enable CORS headers
cors_origins: "*"  # Allowed origins (* for any, or comma-separated list)
cors_methods: "GET, POST, PUT, DELETE, OPTIONS"  # Allowed HTTP methods
cors_headers: "Content-Type, Authorization"  # Allowed request headers

# Authentication (delegated to Lua scripts)
enable_auth: false  # Enable authentication middleware
auth_script: "auth"  # Lua script name for token validation
auth_protected_paths: "/api/*"  # Paths requiring authentication
auth_public_paths: "/api/login, /api/register"  # Always public paths

# Phase 5: Observability
# -----------------------

# Prometheus Metrics
enable_metrics: true  # Enable Prometheus metrics endpoint at /metrics

# Health Check
enable_health_check: true  # Enable health check endpoint at /health

# Request ID Propagation
enable_request_id: true  # Enable X-Request-ID header propagation

# Structured Logging
log_format: "text"  # Log format: "text" or "json" (JSON enables structured logging)

# Phase 7: Security Enhancements
# ------------------------------

# IP Access Control (blacklist/whitelist)
enable_ip_blacklist: false  # Enable IP access control
ip_blacklist: ""  # Comma-separated list of blocked IPs/CIDRs (e.g., "10.0.0.0/8, 192.168.1.100")
ip_whitelist: ""  # Comma-separated list of whitelisted IPs/CIDRs (bypass rate limiting)


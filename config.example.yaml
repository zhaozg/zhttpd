# zhttpd Example Configuration File
# This file demonstrates all available configuration options

# Server Binding
host: "0.0.0.0"
port: 8080

# Static files directory
static_dir: "./examples/static"

# Lua scripts directory
lua_scripts_dir: "./examples/lua"

# Security
security_headers: true

# Maximum request body size (10MB)
max_body_size: 10485760
timeout_seconds: 30
thread_pool_size: 4

# Maximum concurrent connections
max_connections: 512

# Request/response buffer size (64KB)
request_buffer_size: 65536

enable_lua: true
log_level: "info"
log_file: "zhttpd.log"
access_log_file: "access.log"

# Lua Path Configuration
# LUA_PATH and LUA_CPATH for Lua module loading
# If not specified or empty, Lua uses its default search paths
# Example for LUA_PATH: "./?.lua;./lib/?.lua;/usr/local/share/lua/5.4/?.lua"
# Example for LUA_CPATH: "./?.so;./lib/?.so;/usr/local/lib/lua/5.4/?.so"
lua_path: ""
lua_cpath: ""

# Script reload mode: never, auto, or force
reload: "auto"

# Maximum file size to cache (1MB)
max_cache_file_size: 1048576

# Enable ETag caching for static files
enable_etag: true

# Phase 3: Advanced httpz Features
# ---------------------------------

# WebSocket Support
enable_websocket: false

# Server-Sent Events (SSE)
enable_sse: false

# Rate Limiting
enable_rate_limit: false
rate_limit_requests: 100
rate_limit_window: 60

# CORS (Cross-Origin Resource Sharing)
enable_cors: false
cors_origins: "*"
cors_methods: "GET, POST, PUT, DELETE, OPTIONS"
cors_headers: "Content-Type, Authorization"

# CORS Origin Cache Size
# LRU cache for CORS origin decisions (improves performance with many origins)
# Recommended: 1000 for production, 0 to disable caching
# Only effective when cors_origins is not "*" (wildcard disables caching automatically)
cors_origin_cache_size: 1000

# Authentication (delegated to Lua scripts)
enable_auth: false
auth_script: "auth"
auth_protected_paths: "/api/*"
auth_public_paths: "/api/login, /api/register"

# Phase 5: Observability
# -----------------------

# Prometheus Metrics
enable_metrics: true

# Health Check
enable_health_check: true

# Request ID Propagation
enable_request_id: true

# Structured Logging (text or json)
log_format: "text"

# Async logging for better performance (default: false)
# When enabled, log messages are written asynchronously in a background thread
log_async: false

# Console logging output (default: true)
# When enabled, logs are also written to stderr in addition to log files
log_console: true

# Phase 7: Security Enhancements
# ------------------------------

# IP Access Control (blacklist/whitelist)
enable_ip_blacklist: false
ip_blacklist: ""
ip_whitelist: ""

# IP Access Cache Size
# LRU cache for IP access decisions (improves performance for persistent connections)
# Recommended: 10000 for production, 0 to disable caching
# Higher values use more memory (~20 bytes per cached IP) but improve performance
ip_access_cache_size: 10000

# Database Plugin Configuration
# -----------------------------
# Enable database connectivity through zdbc
# Supports SQLite, PostgreSQL, and MySQL
enable_db: false

# Default database connection URI (creates a "default" data source)
# Formats:
#   SQLite:     sqlite:///path/to/database.db
#   SQLite:     sqlite://:memory:  (in-memory database)
#   PostgreSQL: postgresql://user:password@host:port/database
#   MySQL:      mysql://user:password@host:port/database
db_uri: ""

# Connection pool size for default data source (1 = no pooling)
db_pool_size: 5

# Named data sources (optional, for multiple database connections)
# Each data source can be accessed in Lua via context:db("name")
# If not specified, only the "default" data source from db_uri is available
#
# data_sources:
#   - name: default
#     uri: "sqlite:///data/app.db"
#     pool_size: 5
#   - name: users_db
#     uri: "postgresql://user:pass@localhost:5432/users"
#     pool_size: 10
#   - name: logs_db
#     uri: "mysql://user:pass@localhost:3306/logs"
#     pool_size: 3

# Handler Configuration
# ---------------------
# Map URL patterns to handler names
# Patterns are matched in order, so more specific patterns should come first
# If not specified, default handlers are used based on feature flags
#
# RECOMMENDED: Use sequence format to preserve handler order:
# handlers:
#   - pattern: /health
#     handler: Handler.HealthCheckHandler
#   - pattern: /metrics
#     handler: Handler.MetricsHandler
#   - pattern: /ws
#     handler: Handler.WebSocketHandler
#   - pattern: /api/*
#     handler: Handler.LuaHandler
#   - pattern: /*
#     handler: Handler.StaticFileHandler
#
# Alternative: Map format (simpler but order not guaranteed):
# handlers:
#   /health: Handler.HealthCheckHandler
#   /api/*: Handler.LuaHandler
#   /*: Handler.StaticFileHandler

